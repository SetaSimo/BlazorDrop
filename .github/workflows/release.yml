name: Publish NuGet

on:
  push:
    branches:
      - "release-*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version and line
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release-}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Branch '$GITHUB_REF_NAME' must be named release-<version>, e.g. release-1.2.0 or release-2.1.0-beta.1"
            exit 1
          fi
          case "${version%%.*}" in
            1) line=legacy ;;
            2) line=modern ;;
            *) echo "::error::Version '$version': major must be 1 (.NET Core 3.1) or 2 (.NET 6/8/10)"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "Packing $version as the '$line' line"

      - name: Pack
        run: >
          dotnet pack BlazorDrop/BlazorDrop.csproj -c Release -o artifacts
          -p:BlazorDropLine=${{ steps.meta.outputs.line }}
          -p:Version=${{ steps.meta.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Verify package contents
        shell: bash
        run: |
          pkg="artifacts/BlazorDrop.${{ steps.meta.outputs.version }}.nupkg"
          libs=$(unzip -Z1 "$pkg" | grep -o '^lib/[^/]*' | sort -u | tr '\n' ' ')
          case "${{ steps.meta.outputs.line }}" in
            legacy) expected="lib/netstandard2.1 " ;;
            modern) expected="lib/net10.0 lib/net6.0 lib/net8.0 " ;;
          esac
          echo "lib folders: $libs"
          [ "$libs" = "$expected" ] || { echo "::error::Expected '$expected' but the package contains '$libs'"; exit 1; }
          for asset in staticwebassets/BlazorDropSelect.js staticwebassets/BlazorDropSelect.css README.md; do
            unzip -Z1 "$pkg" | grep -qx "$asset" || { echo "::error::$asset is missing from the package"; exit 1; }
          done
          if unzip -Z1 "$pkg" | grep -qi 'BlazorDropTest'; then
            echo "::error::The demo project leaked into the package"; exit 1
          fi
          echo "Package contents:"; unzip -Z1 "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: BlazorDrop-${{ steps.meta.outputs.version }}
          path: artifacts/*

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BlazorDrop ${{ steps.meta.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
